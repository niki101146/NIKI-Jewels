{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block admin_title %}Admin Dashboard{% endblock %} | NIKI Jewels</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--zy-surface);
            color: var(--zy-text);
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           ADMIN LAYOUT
        ===================================================== */

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .admin-sidebar {
            width: 275px;
            min-height: 100vh;

            background: var(--zy-surface);

            border-right: 1px solid var(--zy-line);

            padding: 28px 14px;

            display: flex;
            flex-direction: column;

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }


        /* LOGO */

        .admin-logo {
            text-decoration: none;
            color: var(--zy-text);

            padding: 0 20px 30px;

            display: block;
        }

        .logo-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-star {
            color: var(--zy-gold-text);
            font-size: 29px;
            line-height: 1;
        }

        .logo-main {
            font-size: 29px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-sub {
            display: block;

            margin-left: 8px;
            margin-top: 2px;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 5px;
        }


        /* NAVIGATION */

        .sidebar-menu {
            margin-top: 12px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;

            gap: 17px;

            width: 100%;

            padding: 13px 15px;

            margin-bottom: 7px;

            border-radius: 7px;

            text-decoration: none;

            color: var(--zy-text);

            font-size: 16px;

            transition: .2s ease;
        }

        .sidebar-link i {
            width: 25px;

            font-size: 22px;

            text-align: center;
        }

        .sidebar-link:hover {
            background: var(--zy-page);
        }

        .sidebar-link.active {
            background: #0a0a0a;
            color: #ffffff;
        }


        /* DIVIDER */

        .sidebar-divider {
            height: 1px;

            background: var(--zy-page);

            margin: 22px 10px;
        }


        /* BOTTOM */

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout-link {
            color: var(--zy-text);
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .admin-main {
            margin-left: 275px;

            width: calc(100% - 275px);

            padding: 25px 30px 45px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .dashboard-header {
            margin-bottom: 20px;
        }

        .dashboard-header h1 {
            margin: 0;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 34px;
            font-weight: 500;

            color: var(--zy-text);
        }

        .dashboard-header p {
            margin: 5px 0 0;

            color: #718096;

            font-size: 17px;
        }


        /* =====================================================
           STAT CARDS
        ===================================================== */

        .stat-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 24px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--zy-surface);

            border: 1px solid var(--zy-line);

            border-radius: 9px;

            min-height: 76px;

            padding: 14px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, .035);
        }

        .stat-value {
            font-family: Georgia, "Times New Roman", serif;

            font-size: 24px;
            font-weight: 600;

            color: var(--zy-text-2);
        }

        .stat-label {
            margin-top: 2px;

            color: #738094;

            font-size: 13px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;

            border-radius: 10px;

            background: var(--zy-page);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--zy-text);

            font-size: 22px;
        }


        /* =====================================================
           SECTION CARD
        ===================================================== */

        .dashboard-section {
            background: var(--zy-surface);

            border: 1px solid var(--zy-line);

            border-radius: 9px;

            padding: 18px 22px 20px;

            margin-bottom: 20px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, .03);
        }


        .section-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .section-title {
            margin: 0;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 24px;

            font-weight: 500;

            color: var(--zy-text-2);
        }

        .section-subtitle {
            margin: 4px 0 0;

            color: #718096;

            font-size: 14px;
        }


        /* BUTTON */

        .dark-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            background: #0a0a0a;

            color: #ffffff;

            border: none;

            border-radius: 7px;

            padding: 10px 17px;

            font-size: 13px;

            text-decoration: none;

            transition: .2s ease;
        }

        .dark-button:hover {
            background: var(--zy-gold);

            color: #0a0a0a;
        }


        /* =====================================================
           ORDERS AREA
        ===================================================== */

        .orders-layout {
            display: grid;

            grid-template-columns: 220px 1fr;

            gap: 12px;
        }


        .orders-summary {
            background: var(--zy-surface);

            border: 1px solid var(--zy-line);

            border-radius: 7px;

            padding: 20px;
        }

        .order-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: var(--zy-hover);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            margin-bottom: 15px;
        }

        .order-number {
            font-family: Georgia, "Times New Roman", serif;

            font-size: 21px;

            font-weight: 600;
        }

        .order-label {
            color: #718096;

            font-size: 13px;

            margin-top: 3px;
        }

        .summary-divider {
            height: 1px;

            background: var(--zy-surface);

            margin: 18px 0;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .admin-table-wrapper {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;

            border-collapse: separate;

            border-spacing: 0;

            border: 1px solid #2d3843;

            border-radius: 8px;

            overflow: hidden;
        }

        .admin-table th {
            background: #19262e;

            color: var(--zy-text);

            font-size: 13px;

            font-weight: 500;

            padding: 13px 14px;

            border-bottom: 1px solid #303940;

            white-space: nowrap;
        }

        .admin-table td {
            padding: 11px 14px;

            font-size: 13px;

            color: var(--zy-text-2);

            border-bottom: 1px solid #2f3a41;

            vertical-align: middle;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .product-image {
            width: 50px;
            height: 50px;

            object-fit: cover;

            border-radius: 7px;

            background: var(--zy-page);
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: inline-block;

            padding: 5px 11px;

            border-radius: 6px;

            font-size: 12px;
        }

        .status-pending {
            background: #341417;
            color: #d83a4a;
        }

        .status-packed {
            background: #14342b;
            color: #76e5cb;
        }

        .status-shipped {
            background: #142034;
            color: #3974c8;
        }

        .status-confirmed {
            background: var(--zy-hover);
            color: var(--zy-gold-text);
        }


        /* =====================================================
           PRODUCT MANAGEMENT
        ===================================================== */

        .product-action {
            display: inline-block;

            padding: 6px 13px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 12px;

            margin-right: 5px;

            transition: .2s ease;
        }

        .edit-button {
            border: 1px solid var(--zy-gold);

            color: var(--zy-text-2);

            background: var(--zy-surface);
        }

        .edit-button:hover {
            background: #0a0a0a;

            color: #ffffff;
        }

        .delete-button {
            border: 1px solid #4c2428;

            color: #e33a4a;

            background: var(--zy-surface);
        }

        .delete-button:hover {
            background: #e33a4a;

            color: #ffffff;
        }


        /* =====================================================
           EMPTY MESSAGE
        ===================================================== */

        .empty-message {
            padding: 30px;

            text-align: center;

            color: #718096;

            font-size: 14px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .admin-sidebar {
                width: 220px;
            }

            .admin-main {
                margin-left: 220px;

                width: calc(100% - 220px);
            }

            .stat-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .orders-layout {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 850px) {

            .admin-sidebar {
                width: 75px;

                padding: 20px 10px;
            }

            .admin-main {
                margin-left: 75px;

                width: calc(100% - 75px);

                padding: 20px;
            }

            .logo-main,
            .logo-sub,
            .sidebar-link span {
                display: none;
            }

            .admin-logo {
                padding: 0 0 25px;

                text-align: center;
            }

            .logo-star {
                font-size: 28px;
            }

            .sidebar-link {
                justify-content: center;

                padding: 13px 5px;
            }

            .sidebar-link i {
                margin: 0;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .admin-main {
                padding: 18px 12px;
            }

            .dashboard-header h1 {
                font-size: 28px;
            }

            .dashboard-section {
                padding: 15px;
            }

            .section-top {
                align-items: flex-start;

                gap: 12px;

                flex-direction: column;
            }

        }

    </style>

    <link rel="stylesheet" href="{% static 'css/responsive.css' %}?v=20261029-theme">
<link rel="stylesheet" href="{% static 'css/admin-mobile.css' %}?v=2">
<link rel="icon" type="image/png" href="{% static 'images/niki-jewels-logo.png' %}">
<style>.niki-logo-image{width:64px;height:64px;object-fit:contain;border-radius:10px;flex-shrink:0} @media(max-width:767px){.niki-logo-image{width:48px;height:48px}}</style>
    <link rel="stylesheet" href="{% static 'css/theme-black-gold.css' %}?v=2">
<link rel="stylesheet" href="{% static 'css/admin-theme.css' %}?v=3">
<script>(function(){try{var t=localStorage.getItem("niki-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-bs-theme",t);}catch(e){}})();</script>
</head>


<body>
<header class="admin-mobile-header">
<button type="button" id="adminMenuOpen" aria-label="Open admin menu" aria-controls="adminSidebar" aria-expanded="false">☰</button>
<a href="{% url 'admin_dashboard' %}"><img class="niki-logo-image" src="{% static 'images/niki-jewels-logo.png' %}" alt="NIKI Jewels logo"> NIKI Jewels <small>ADMIN</small></a>
<button type="button" class="admin-theme-btn" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode"><i class="bi bi-sun-fill theme-icon-sun" aria-hidden="true"></i><i class="bi bi-moon-stars-fill theme-icon-moon" aria-hidden="true"></i></button>
</header>
<div class="admin-menu-backdrop" id="adminMenuBackdrop" hidden></div>


<div class="admin-layout">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
<button type="button" class="admin-menu-close" id="adminMenuClose" aria-label="Close admin menu">Close <span aria-hidden="true">×</span></button>


        <!-- LOGO -->

        <a href="{% url 'admin_dashboard' %}"
           class="admin-logo">

            <div class="logo-top">

                <img class="niki-logo-image" src="{% static 'images/niki-jewels-logo.png' %}" alt="NIKI Jewels logo">

                <span class="logo-main">
                    NIKI
                </span>

            </div>

            <span class="logo-sub">
                Jewels
            </span>

        </a>


        <!-- MENU -->

        <nav class="sidebar-menu">


            <!-- DASHBOARD -->

            <a href="{% url 'admin_dashboard' %}"
               class="sidebar-link{% if admin_page == 'dashboard' %} active{% endif %}">

                <i class="bi bi-grid"></i>

                <span>
                    Dashboard
                </span>

            </a>


            <!-- PRODUCTS -->

            <a href="{% url 'add_product' %}"
               class="sidebar-link">

                <i class="bi bi-file-earmark-text"></i>

                <span>
                    Products
                </span>

            </a>


            <!-- HERO BANNERS -->
            <a href="{% url 'admin_banners' %}"
               class="sidebar-link{% if admin_page == 'banners' %} active{% endif %}">
                <i class="bi bi-images"></i>
                <span>
                    Hero Banners
                </span>
            </a>

            <!-- HOME CATEGORIES -->
            <a href="{% url 'admin_home_categories' %}"
               class="sidebar-link{% if admin_page == 'categories' %} active{% endif %}">
                <i class="bi bi-tags"></i>
                <span>
                    Categories
                </span>
            </a>

            <!-- ORDERS -->

            <a href="{% url 'admin_orders' %}"
               aria-label="Orders" class="sidebar-link{% if admin_page == 'orders' %} active{% endif %}">

                <i class="bi bi-calendar3"></i>

                <span>
                    Orders
                </span>

            </a>


            <!-- SETTINGS -->
            <a href="{% url 'admin_settings' %}"
               class="sidebar-link{% if admin_page == 'settings' %} active{% endif %}">
                <i class="bi bi-gear"></i>
                <span>
                    Settings
                </span>
            </a>

            <!-- WEBSITE -->

            <a href="{% url 'home' %}"
               class="sidebar-link">

                <i class="bi bi-gem"></i>

                <span>
                    View website
                </span>

            </a>


        </nav>


        <div class="sidebar-divider"></div>


        <!-- LOGOUT -->

        <div class="sidebar-bottom">

            <button type="button" class="sidebar-link theme-link admin-theme-btn" data-theme-toggle aria-label="Switch to light mode">
                <i class="bi bi-sun-fill theme-icon-sun" aria-hidden="true"></i><i class="bi bi-moon-stars-fill theme-icon-moon" aria-hidden="true"></i>
                <span><span class="theme-label-light">Light mode</span><span class="theme-label-dark">Dark mode</span></span>
            </button>

            <a href="{% url 'admin_logout' %}"
               class="sidebar-link logout-link">

                <i class="bi bi-box-arrow-right"></i>

                <span>
                    Logout
                </span>

            </a>

        </div>


    </aside>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


        <!-- =================================================
             HEADER
        ================================================== -->

{% block admin_content %}{% endblock %}
    </main>

</div>


<script src="{% static 'js/admin-mobile.js' %}?v=1"></script>
<script src="{% static 'js/theme.js' %}?v=1"></script>
<script src="{% static 'js/password-toggle.js' %}?v=1"></script>
</body>

</html>
